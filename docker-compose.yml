services:
  app:
    build: .
    container_name: mm_app
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: mm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: mm_neo4j
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4jpassword 'RETURN 1' || exit 1"]
      interval: 10s
      retries: 20
